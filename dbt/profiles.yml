# The warehouse path comes from `margin`, which sets MARGIN_WAREHOUSE_PATH for the
# dbt subprocess. One thread keeps every run deterministic.
margin:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('MARGIN_WAREHOUSE_PATH') }}"
      threads: 1
      # The same memory and thread caps as every connection `margin` opens (defaults 2GB and
      # 2): DuckDB would otherwise take 80% of the machine's memory and every core for this
      # one run. `threads` above is dbt's own model parallelism; this one is DuckDB's.
      settings:
        memory_limit: "{{ env_var('MARGIN_DUCKDB_MEMORY_LIMIT', '2GB') }}"
        threads: "{{ env_var('MARGIN_DUCKDB_THREADS', '2') }}"
