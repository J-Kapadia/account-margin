# The warehouse path comes from `margin`, which sets MARGIN_WAREHOUSE_PATH for the
# dbt subprocess. One thread keeps every run deterministic.
margin:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('MARGIN_WAREHOUSE_PATH') }}"
      threads: 1
      # The same memory cap as every connection `margin` opens (default 2GB): DuckDB would
      # otherwise take 80% of the machine's memory for this one run.
      settings:
        memory_limit: "{{ env_var('MARGIN_DUCKDB_MEMORY_LIMIT', '2GB') }}"
